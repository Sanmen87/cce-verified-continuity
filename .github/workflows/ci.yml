name: Public alpha checks
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19.0', '24.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command rg -ErrorAction SilentlyContinue)) { choco install ripgrep -y --no-progress }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:public
      - run: npm run test:release
      - run: npm run test:evaluation
      - run: npm run demo:continuity
      - run: npm run build
      - run: npm run smoke:pi
      - run: npm audit --audit-level=moderate --ignore-scripts
      - run: npm run release:stage
      - run: npm run release:audit
      - run: npm run release:pack
      - run: npm run release:clean-install
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: alpha-${{ matrix.os }}-${{ matrix.node }}
          path: |
            release-artifacts/run-*/*.tgz
            release-artifacts/clean-install.json
            release-artifacts/release-audit.json
          retention-days: 7
